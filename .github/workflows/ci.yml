name: Aya static kernel validation

on:
  push:
    branches: [codex/static-kernel-matrix-validation]

permissions:
  contents: read

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Check Starlark
        run: bazel run //bazel/format:format.check --lockfile_mode=error

      - name: Check the native configuration and boot Linux 6.18
        timeout-minutes: 210
        run: |
          set -euxo pipefail
          # Use this host while the remote executor cannot fetch its OCI image.
          # Delete retired kernel sandboxes synchronously to avoid the backlog
          # observed when the family build exhausted disk space.
          bazel --host_jvm_args=-Xmx8g test --config=remote \
            --lockfile_mode=error \
            --remote_download_outputs=toplevel \
            --@rules_rust//rust/toolchain/channel=stable \
            --remote_executor= \
            --extra_execution_platforms=@platforms//host:host \
            --platforms=@platforms//host:host \
            --jobs=4 \
            --profile="$RUNNER_TEMP/kernel-validation.profile.gz" \
            --experimental_sandbox_async_tree_delete_idle_threads=0 \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            @aya_kernel_6_18//consumer:kernel_config_parity_${{ matrix.arch }} \
            //test/integration-test:vm_${{ matrix.arch }}_6_18

      - name: Save kernel validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-vm-results-${{ matrix.arch }}
          path: |
            bazel-testlogs/test/integration-test/vm_${{ matrix.arch }}_6_18/test.log
            bazel-testlogs/test/integration-test/vm_${{ matrix.arch }}_6_18/test.xml
            bazel-testlogs/test/integration-test/vm_${{ matrix.arch }}_6_18/test.outputs/
            bazel-testlogs/external/*aya_kernel_6_18/consumer/kernel_config_parity_${{ matrix.arch }}/test.log
            bazel-testlogs/external/*aya_kernel_6_18/consumer/kernel_config_parity_${{ matrix.arch }}/test.xml
            bazel-testlogs/external/*aya_kernel_6_18/consumer/kernel_config_parity_${{ matrix.arch }}/test.outputs/
            ${{ runner.temp }}/kernel-validation.profile.gz
