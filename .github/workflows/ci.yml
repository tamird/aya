name: Aya static configuration validation

on:
  push:
    branches: [codex/static-kernel-config-validation]

permissions:
  contents: read

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check Starlark
        run: bazel run //bazel/format:format.check --lockfile_mode=error

      - name: Compare Aya configurations with native Linux
        timeout-minutes: 80
        run: |
          set -euxo pipefail
          # Use this host while the remote executor cannot fetch its OCI image.
          # Delete retired kernel sandboxes synchronously to avoid the backlog
          # observed when the family build exhausted disk space.
          bazel --host_jvm_args=-Xmx8g test --config=remote \
            --keep_going \
            --lockfile_mode=error \
            --remote_download_outputs=toplevel \
            --@rules_rust//rust/toolchain/channel=stable \
            --remote_executor= \
            --extra_execution_platforms=@platforms//host:host \
            --platforms=@platforms//host:host \
            --jobs=4 \
            --experimental_sandbox_async_tree_delete_idle_threads=0 \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --remote_downloader_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            @aya_kernel_5_10//consumer:kernel_config_parity \
            @aya_kernel_5_15//consumer:kernel_config_parity \
            @aya_kernel_6_1//consumer:kernel_config_parity \
            @aya_kernel_6_6//consumer:kernel_config_parity \
            @aya_kernel_6_12//consumer:kernel_config_parity \
            @aya_kernel_6_18//consumer:kernel_config_parity

      - name: Save native configuration comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-config-results
          path: |
            bazel-testlogs/external/*aya_kernel_*/consumer/kernel_config_parity_*/test.log
            bazel-testlogs/external/*aya_kernel_*/consumer/kernel_config_parity_*/test.xml
            bazel-testlogs/external/*aya_kernel_*/consumer/kernel_config_parity_*/test.outputs/
